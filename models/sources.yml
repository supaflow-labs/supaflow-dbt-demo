- name: sfmc
  database: '{{ target.database }}'
  schema: '{{ target.schema }}_SFMC'
  tables:
  - name: subscribers
    identifier: SUBSCRIBERS
    description: Measured SFMC smoke landing schema; 8 source fields and 5 Supaflow
      landing fields. Metadata only, no source rows.
    config:
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour
      loaded_at_query: select max(last_altered) from {{ target.database }}.information_schema.tables
        where table_schema = upper('{{ target.schema }}_SFMC') and table_name = 'SUBSCRIBERS'
  - name: event
    identifier: EVENT
    description: Actual Dev SFMC event catalog (27 fields); smoke exported zero events
      and did not create EVENT. Canonical-type Snowflake mapping plus 5 standard Supaflow
      landing fields; no live EVENT physical schema available.
    config:
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour
      loaded_at_query: select max(last_altered) from {{ target.database }}.information_schema.tables
        where table_schema = upper('{{ target.schema }}_SFMC') and table_name = 'EVENT'
