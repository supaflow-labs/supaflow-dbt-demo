version: 2
sources:
- name: salesforce
  database: '{{ target.database }}'
  schema: '{{ target.schema }}_SALESFORCE'
  tables:
  - name: account
    identifier: ACCOUNT
    description: Live SUPA_DB.SALESFORCE information_schema.columns; metadata only
    config:
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour
      loaded_at_query: select max(last_altered) from {{ target.database }}.information_schema.tables
        where table_schema = upper('{{ target.schema }}_SALESFORCE') and table_name
        = 'ACCOUNT'
  - name: opportunity
    identifier: OPPORTUNITY
    description: Live SUPA_DB.SALESFORCE information_schema.columns; metadata only
    config:
