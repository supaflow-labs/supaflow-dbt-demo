name: supaflow_customer_demo
version: 1.0.0
config-version: 2
profile: supaflow_customer_demo
require-dbt-version:
- '>=1.10.0'
- <2.0.0
model-paths:
- models
seed-paths:
- seeds
test-paths:
- tests
macro-paths:
- macros
analysis-paths:
- analyses
snapshot-paths:
- snapshots
models:
  supaflow_customer_demo:
    staging:
      +materialized: view
      +schema: STAGING
    intermediate:
      +materialized: view
      +schema: INTERMEDIATE
    marts:
      +materialized: table
vars:
  demo_as_of_date: '2026-10-15'
on-run-start:
- '{{ assert_demo_target() }}'
