    netsuite:
      netsuite_customer:
        +schema: NETSUITE
        +alias: CUSTOMER
        +column_types:
          ID: NUMBER(38,0)
          ENTITYID: VARCHAR(256)
          COMPANYNAME: VARCHAR(256)
          EMAIL: VARCHAR(256)
          ISINACTIVE: VARCHAR(1)
          CURRENCY: NUMBER(38,0)
          LASTMODIFIEDDATE: TIMESTAMP_NTZ(9)
      netsuite_transaction:
        +schema: NETSUITE
        +alias: TRANSACTION
        +column_types:
          ID: NUMBER(38,0)
